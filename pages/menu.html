<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#090a0a" />
    <title>Меню — NO FEAR</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #090a0a;
        --panel: #111313;
        --panel-light: #181a1a;
        --text: #f4f4f2;
        --muted: #85898a;
        --line: #303333;
        --red: #d51f25;
        --red-dark: #b80912;
        --content-width: 1202px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        padding: 0 24px 138px;
        background:
          linear-gradient(90deg, transparent calc(50% - 1px), #ffffff08 50%, transparent calc(50% + 1px)),
          var(--bg);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
      }

      button,
      input {
        font: inherit;
      }

      button {
        color: inherit;
      }

      .page {
        width: min(100%, var(--content-width));
        margin: 0 auto;
      }

      .ticker {
        height: 4px;
        overflow: hidden;
        border-top: 1px solid #242626;
        color: var(--red);
        font-size: 7px;
        font-weight: 900;
        letter-spacing: 2px;
        line-height: 1px;
        text-align: right;
      }

      .ticker span {
        position: relative;
        top: -1px;
        padding: 0 8px;
        background: var(--bg);
      }

      .toolbar {
        padding-top: 16px;
      }

      .search {
        display: flex;
        align-items: center;
        height: 43px;
        border: 1px solid #303333;
        background: #101212;
      }

      .search-icon {
        padding: 0 12px;
        color: var(--red);
        font-size: 19px;
        line-height: 1;
      }

      .search input {
        width: 100%;
        height: 100%;
        border: 0;
        outline: 0;
        background: transparent;
        color: var(--text);
        font-size: 13px;
      }

      .search input::placeholder {
        color: #777d7e;
      }

      .category-list {
        display: flex;
        gap: 7px;
        margin-top: 11px;
        overflow-x: auto;
        scrollbar-width: none;
      }

      .category-list::-webkit-scrollbar {
        display: none;
      }

      .category {
        flex: 0 0 auto;
        min-height: 34px;
        padding: 0 15px;
        border: 1px solid #303333;
        background: transparent;
        color: #a9adae;
        cursor: pointer;
        font-size: 10px;
        font-weight: 800;
        transition: background 160ms ease, border-color 160ms ease, color 160ms ease;
      }

      .category:hover,
      .category[aria-pressed="true"] {
        border-color: var(--red);
        background: var(--red);
        color: white;
      }

      .section-rule {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 30px;
        padding: 9px 0 8px;
        border-top: 1px solid #414444;
        border-bottom: 1px solid #242626;
        color: #c3c6c6;
        font-size: 8px;
        font-weight: 800;
        letter-spacing: 1px;
      }

      .section-rule strong {
        margin-left: 10px;
        color: #f1f1ef;
        font-size: 9px;
      }

      .section-rule .safety {
        color: var(--red);
      }

      .menu-heading {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 20px;
        margin: 28px 0 17px;
      }

      .eyebrow {
        margin: 0 0 4px;
        color: var(--red);
        font-size: 10px;
        font-weight: 900;
        letter-spacing: 2px;
      }

      h1 {
        margin: 0;
        font-size: clamp(28px, 3vw, 34px);
        font-weight: 950;
        letter-spacing: -1.8px;
        line-height: 1;
        text-transform: uppercase;
      }

      .add-item {
        min-height: 34px;
        padding: 0 15px;
        border: 1px solid #c5c8c8;
        background: linear-gradient(135deg, #f0f0ef, #aeb2b2);
        color: #101212;
        cursor: pointer;
        font-size: 10px;
        font-weight: 900;
        text-transform: uppercase;
        transition: filter 160ms ease;
      }

      .add-item:hover {
        filter: brightness(1.15);
      }

      .menu-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 15px;
      }

      .menu-card {
        min-width: 0;
        overflow: hidden;
        border: 1px solid #555a5a;
        border-radius: 10px;
        background: linear-gradient(145deg, #151717, #0e1010);
        box-shadow: 0 8px 24px #0005;
      }

      .product-art {
        position: relative;
        display: grid;
        height: clamp(190px, 18.2vw, 240px);
        place-items: center;
        overflow: hidden;
        border-bottom: 1px solid #282b2b;
        background:
          linear-gradient(150deg, transparent 48%, #a922285c 48.5%, #a922285c 49.2%, transparent 50%),
          repeating-linear-gradient(40deg, #ffffff08 0 2px, transparent 2px 10px),
          linear-gradient(145deg, #222525, #111313);
      }

      .product-art::before {
        position: absolute;
        inset: 9% 10%;
        border: 1px dashed #ffffff27;
        content: "";
        transform: rotate(-4deg);
      }

      .product-art::after {
        position: absolute;
        top: 13px;
        right: 10px;
        color: var(--red);
        content: "///";
        font-size: 20px;
        font-weight: 1000;
        letter-spacing: -5px;
        transform: rotate(-12deg);
      }

      .art-label {
        z-index: 1;
        padding: 7px 9px;
        border: 1px solid #737878;
        background: #111313c9;
        color: #aab0b0;
        font-size: 8px;
        font-weight: 900;
        letter-spacing: 1px;
      }

      .quick-add {
        position: absolute;
        z-index: 2;
        right: 9px;
        bottom: 9px;
        display: grid;
        width: 26px;
        height: 26px;
        padding: 0;
        place-items: center;
        border: 0;
        border-radius: 50%;
        background: var(--red);
        color: white;
        cursor: pointer;
        font-size: 21px;
        line-height: 1;
        transition: background 160ms ease, transform 160ms ease;
      }

      .quick-add:hover {
        transform: scale(1.08);
        background: #f02b32;
      }

      .card-content {
        min-height: 135px;
        padding: 16px 12px 13px;
      }

      .card-category {
        margin: 0 0 9px;
        color: var(--red);
        font-size: 9px;
        font-weight: 950;
        letter-spacing: 1.5px;
        text-transform: uppercase;
      }

      .card-content h2 {
        margin: 0 0 7px;
        font-size: 15px;
        font-weight: 900;
        text-transform: uppercase;
      }

      .description {
        min-height: 24px;
        margin: 0;
        color: #929797;
        font-size: 9px;
        line-height: 1.5;
      }

      .price {
        margin: 10px 0 0;
        color: var(--red);
        font-family: Impact, "Arial Narrow", sans-serif;
        font-size: 17px;
        letter-spacing: 1px;
      }

      .empty-state {
        grid-column: 1 / -1;
        padding: 40px 16px;
        border: 1px dashed #414444;
        color: var(--muted);
        text-align: center;
      }

      .cart-bar {
        position: fixed;
        z-index: 5;
        right: 50%;
        bottom: 73px;
        display: flex;
        width: min(calc(100% - 44px), 1242px);
        min-height: 46px;
        align-items: center;
        justify-content: space-between;
        padding: 7px 16px;
        border: 1px solid #f03a40;
        border-radius: 4px;
        background: var(--red-dark);
        box-shadow: 0 8px 24px #0008;
        cursor: pointer;
        transform: translateX(50%);
        font-size: 11px;
        font-weight: 900;
      }

      .cart-left {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .cart-count {
        display: grid;
        width: 21px;
        height: 21px;
        place-items: center;
        border-radius: 50%;
        background: white;
        color: var(--red-dark);
        font-size: 10px;
      }

      .bottom-nav {
        position: fixed;
        z-index: 4;
        right: 0;
        bottom: 0;
        left: 0;
        display: flex;
        height: 65px;
        align-items: center;
        justify-content: space-around;
        border-top: 1px solid #292c2c;
        background: #090a0af2;
        backdrop-filter: blur(10px);
      }

      .nav-item {
        display: grid;
        min-width: 68px;
        justify-items: center;
        gap: 4px;
        color: #777c7c;
        font-size: 8px;
        font-weight: 800;
        text-decoration: none;
      }

      .nav-icon {
        display: grid;
        width: 22px;
        height: 22px;
        place-items: center;
        border: 2px solid #7b8080;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #bfc3c3, #353939 68%);
        box-shadow: 0 0 0 2px #222525;
        color: #151717;
        font-size: 12px;
        font-weight: 950;
      }

      .nav-item[aria-current="page"] {
        color: #f3f3f1;
      }

      .nav-item[aria-current="page"] .nav-icon {
        border-color: #ed454a;
        background: radial-gradient(circle at 35% 30%, #ff6b70, #8b1015 72%);
        box-shadow: 0 0 10px #d51f2566;
        color: white;
      }

      .help-button {
        position: fixed;
        z-index: 6;
        right: 8px;
        bottom: 12px;
        display: grid;
        width: 30px;
        height: 30px;
        place-items: center;
        border: 1px solid #444;
        border-radius: 50%;
        background: #242626;
        color: #ddd;
        cursor: pointer;
        font-size: 17px;
      }

      .toast {
        position: fixed;
        z-index: 8;
        top: 18px;
        left: 50%;
        padding: 11px 16px;
        border: 1px solid #494d4d;
        border-radius: 4px;
        background: #171919;
        box-shadow: 0 8px 26px #0009;
        color: white;
        font-size: 12px;
        opacity: 0;
        pointer-events: none;
        transform: translate(-50%, -8px);
        transition: opacity 180ms ease, transform 180ms ease;
      }

      .toast.is-visible {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      @media (max-width: 900px) {
        .menu-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .product-art {
          height: clamp(190px, 36vw, 280px);
        }
      }

      @media (max-width: 520px) {
        body {
          padding: 0 14px 138px;
        }

        .toolbar {
          padding-top: 12px;
        }

        .category {
          padding: 0 12px;
        }

        .section-rule {
          margin-top: 23px;
        }

        .menu-heading {
          margin-top: 23px;
        }

        .menu-grid {
          gap: 10px;
        }

        .product-art {
          height: 155px;
        }

        .card-content {
          min-height: 133px;
          padding: 13px 10px 11px;
        }

        .card-content h2 {
          font-size: 13px;
        }

        .description {
          font-size: 8px;
        }

        .price {
          font-size: 15px;
        }

        .cart-bar {
          bottom: 71px;
          width: calc(100% - 24px);
        }

        .bottom-nav {
          height: 62px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="ticker" aria-hidden="true"><span>/// ВІТАЙ У NO FEAR / 100% FRESH ///</span></div>

      <header class="toolbar">
        <label class="search">
          <span class="search-icon" aria-hidden="true">⌕</span>
          <input id="menu-search" type="search" placeholder="Знайти свою жертву..." autocomplete="off" />
        </label>
        <nav class="category-list" aria-label="Категорії меню">
          <button class="category" type="button" data-category="Бургери" aria-pressed="true">БУРГЕРИ</button>
          <button class="category" type="button" data-category="Курка" aria-pressed="false">КУРКА</button>
          <button class="category" type="button" data-category="Снеки" aria-pressed="false">СНЕКИ</button>
          <button class="category" type="button" data-category="Напої" aria-pressed="false">НАПОЇ</button>
          <button class="category" type="button" data-category="Десерти" aria-pressed="false">ДЕСЕРТИ</button>
        </nav>
      </header>

      <div class="section-rule" aria-label="Каталог товарів">
        <span>TYPE / 02 <strong>CHOOSE YOUR MONSTER</strong></span>
        <span class="safety">NO FEAR</span>
      </div>

      <main>
        <div class="menu-heading">
          <div>
            <p class="eyebrow"><span id="item-count">4</span> ПОЗИЦІЇ</p>
            <h1 id="category-title">Бургери</h1>
          </div>
          <button class="add-item" id="add-item" type="button">+ Додати позицію</button>
        </div>

        <section class="menu-grid" id="menu-grid" aria-label="Позиції меню"></section>
      </main>
    </div>

    <button class="cart-bar" id="cart-button" type="button" aria-label="Відкрити кошик">
      <span class="cart-left"><span class="cart-count" id="cart-count">0</span><span>Відкрити кошик</span></span>
      <span id="cart-total">(СУМА) 0 ₴</span>
    </button>

    <nav class="bottom-nav" aria-label="Основна навігація">
      <a class="nav-item" href="#" aria-label="Головна">
        <span class="nav-icon" aria-hidden="true">V</span><span>ГОЛОВНА</span>
      </a>
      <a class="nav-item" href="#" aria-current="page" aria-label="Меню">
        <span class="nav-icon" aria-hidden="true">M</span><span>МЕНЮ</span>
      </a>
      <a class="nav-item" href="#" aria-label="Кошик">
        <span class="nav-icon" aria-hidden="true">C</span><span>КОШИК</span>
      </a>
      <a class="nav-item" href="#" aria-label="Профіль">
        <span class="nav-icon" aria-hidden="true">P</span><span>ПРОФІЛЬ</span>
      </a>
    </nav>

    <button class="help-button" type="button" aria-label="Допомога">?</button>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script>
      const products = [
        { name: "Дабл треш", category: "Бургери", description: "Яловичина / чедер / соус / булка", price: 289 },
        { name: "Чікен монстр", category: "Бургери", description: "Курка / хрустка скоринка / гострий соус", price: 249 },
        { name: "Блек джек", category: "Бургери", description: "Яловичина / сир / карамелізована цибуля", price: 319 },
        { name: "Веган фрік", category: "Бургери", description: "Рослинна котлета / овочі / фірмовий соус", price: 269 },
        { name: "Крильця без правил", category: "Курка", description: "Гострі крильця / соус на вибір", price: 229 },
        { name: "Кранч чікен", category: "Курка", description: "Хрустка курка / салат / фірмовий соус", price: 199 },
        { name: "Фрі з характером", category: "Снеки", description: "Картопля фрі / спеції / соус", price: 99 },
        { name: "Сирні кульки", category: "Снеки", description: "Моцарела / хрустка паніровка", price: 139 },
        { name: "Кола без страху", category: "Напої", description: "Холодний напій, 330 мл", price: 59 },
        { name: "Лимонад монстр", category: "Напої", description: "Домашній лимонад, 400 мл", price: 89 },
        { name: "Брауні після опівночі", category: "Десерти", description: "Шоколадний брауні / какао", price: 119 },
        { name: "Чізкейк хаос", category: "Десерти", description: "Вершковий чізкейк / ягідний соус", price: 149 }
      ];

      const grid = document.querySelector("#menu-grid");
      const searchInput = document.querySelector("#menu-search");
      const categoryTitle = document.querySelector("#category-title");
      const itemCount = document.querySelector("#item-count");
      const cartCount = document.querySelector("#cart-count");
      const cartTotal = document.querySelector("#cart-total");
      const toast = document.querySelector("#toast");
      let activeCategory = "Бургери";
      let cartItems = 0;
      let total = 0;
      let toastTimeout;

      function renderProducts() {
        const query = searchInput.value.trim().toLocaleLowerCase("uk");
        const visibleProducts = products.filter((product) => {
          const matchesCategory = product.category === activeCategory;
          const matchesSearch = `${product.name} ${product.description} ${product.category}`
            .toLocaleLowerCase("uk")
            .includes(query);
          return matchesCategory && matchesSearch;
        });

        categoryTitle.textContent = activeCategory;
        itemCount.textContent = visibleProducts.length;

        if (!visibleProducts.length) {
          grid.innerHTML = '<p class="empty-state">Нічого не знайдено. Спробуй інший запит.</p>';
          return;
        }

        grid.innerHTML = visibleProducts.map((product) => {
          const index = products.indexOf(product);
          return `
            <article class="menu-card">
              <div class="product-art" role="img" aria-label="Зображення: ${product.name}">
                <span class="art-label">(ЗОБРАЖЕННЯ)</span>
                <button class="quick-add" type="button" data-product="${index}" aria-label="Додати ${product.name} до кошика">+</button>
              </div>
              <div class="card-content">
                <p class="card-category">${product.category}</p>
                <h2>${product.name}</h2>
                <p class="description">${product.description}</p>
                <p class="price">/// ${product.price} ₴</p>
              </div>
            </article>
          `;
        }).join("");
      }

      function addToCart(product) {
        cartItems += 1;
        total += product.price;
        cartCount.textContent = cartItems;
        cartTotal.textContent = `(СУМА) ${total} ₴`;
        toast.textContent = `${product.name} додано до кошика`;
        toast.classList.add("is-visible");
        window.clearTimeout(toastTimeout);
        toastTimeout = window.setTimeout(() => toast.classList.remove("is-visible"), 1800);
      }

      document.querySelector(".category-list").addEventListener("click", (event) => {
        const button = event.target.closest("[data-category]");
        if (!button) return;
        activeCategory = button.dataset.category;
        document.querySelectorAll(".category").forEach((category) => {
          category.setAttribute("aria-pressed", String(category === button));
        });
        renderProducts();
      });

      searchInput.addEventListener("input", renderProducts);

      grid.addEventListener("click", (event) => {
        const button = event.target.closest("[data-product]");
        if (!button) return;
        addToCart(products[Number(button.dataset.product)]);
      });

      document.querySelector("#add-item").addEventListener("click", () => {
        toast.textContent = "Щоб додати позицію, зв'яжись з адміністратором";
        toast.classList.add("is-visible");
        window.clearTimeout(toastTimeout);
        toastTimeout = window.setTimeout(() => toast.classList.remove("is-visible"), 2200);
      });

      document.querySelector("#cart-button").addEventListener("click", () => {
        toast.textContent = cartItems ? `У кошику ${cartItems} позицій на ${total} ₴` : "Твій кошик поки порожній";
        toast.classList.add("is-visible");
        window.clearTimeout(toastTimeout);
        toastTimeout = window.setTimeout(() => toast.classList.remove("is-visible"), 2200);
      });

      document.querySelector(".help-button").addEventListener("click", () => {
        toast.textContent = "Потрібна допомога? Напиши нам у чат";
        toast.classList.add("is-visible");
        window.clearTimeout(toastTimeout);
        toastTimeout = window.setTimeout(() => toast.classList.remove("is-visible"), 2200);
      });

      renderProducts();
    </script>
  </body>
</html>
